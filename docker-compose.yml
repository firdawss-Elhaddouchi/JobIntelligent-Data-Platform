# JobIntelligent-Data-Platform - Docker Compose Configuration
# Version: 1.0.0

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.7}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@jobintelligent_postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@jobintelligent_postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@jobintelligent_redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://jobintelligent_airflow_apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-apache-spark apache-airflow-providers-apache-hive boto3}
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'UTC'
    AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'true'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  deploy:
    resources:
      limits:
        memory: 2G
      reservations:
        memory: 1G
  depends_on:
    &airflow-common-depends-on
    jobintelligent_redis:
      condition: service_healthy
    jobintelligent_postgres:
      condition: service_healthy

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  
  jobintelligent_postgres:
    image: postgres:15
    container_name: jobintelligent_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - jobintelligent_network

  # ============================================
  # Redis (for Airflow Celery)
  # ============================================
  
  jobintelligent_redis:
    image: redis:7.2-bookworm
    container_name: jobintelligent_redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - jobintelligent_network

  # ============================================
  # MinIO Object Storage
  # ============================================
  
  jobintelligent_minio:
    image: minio/minio:latest
    container_name: jobintelligent_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - jobintelligent_network

  # ============================================
  # Airflow Services
  # ============================================
  
  jobintelligent_airflow_apiserver:
    <<: *airflow-common
    container_name: jobintelligent_airflow_apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      jobintelligent_airflow_init:
        condition: service_completed_successfully
    networks:
      - jobintelligent_network

  jobintelligent_airflow_scheduler:
    <<: *airflow-common
    container_name: jobintelligent_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      jobintelligent_airflow_init:
        condition: service_completed_successfully
    networks:
      - jobintelligent_network

  jobintelligent_airflow_dag_processor:
    <<: *airflow-common
    container_name: jobintelligent_airflow_dag_processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      jobintelligent_airflow_init:
        condition: service_completed_successfully
    networks:
      - jobintelligent_network

  jobintelligent_airflow_worker:
    <<: *airflow-common
    container_name: jobintelligent_airflow_worker
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      jobintelligent_airflow_apiserver:
        condition: service_healthy
      jobintelligent_airflow_init:
        condition: service_completed_successfully
    networks:
      - jobintelligent_network

  jobintelligent_airflow_triggerer:
    <<: *airflow-common
    container_name: jobintelligent_airflow_triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      jobintelligent_airflow_init:
        condition: service_completed_successfully
    networks:
      - jobintelligent_network

  jobintelligent_airflow_init:
    <<: *airflow-common
    container_name: jobintelligent_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -p /opt/airflow/{logs,dags,plugins,config,scripts,data}
        echo "Waiting for PostgreSQL to be ready..."
        sleep 10
        echo "Airflow version:"
        /entrypoint airflow version
        echo "Initializing database..."
        /entrypoint airflow db init
        echo "Creating admin user..."
        /entrypoint airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-airflow} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-airflow} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        echo "Setting permissions..."
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo "Airflow initialization completed!"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    networks:
      - jobintelligent_network

  # ============================================
  # FastAPI Backend
  # ============================================
  
  jobintelligent_fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: jobintelligent_fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi/app:/app
      - ./scripts:/app/scripts
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql://airflow:airflow@jobintelligent_postgres:5432/airflow
      MINIO_ENDPOINT: jobintelligent_minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      jobintelligent_postgres:
        condition: service_healthy
      jobintelligent_minio:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - jobintelligent_network

  # ============================================
  # Jupyter Lab
  # ============================================
  
  jobintelligent_jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jobintelligent_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./scripts:/home/jovyan/scripts
      - ./data:/home/jovyan/data
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
    user: root
    command: start.sh jupyter lab --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.ip='0.0.0.0'
    depends_on:
      - jobintelligent_postgres
      - jobintelligent_minio
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - jobintelligent_network

networks:
  jobintelligent_network:
    driver: bridge
    name: jobintelligent_network