# Common configurations for Airflow services
x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    _PIP_ADDITIONAL_REQUIREMENTS: 'requests boto3 pandas psycopg2-binary pyspark'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- DATABASE LAYER ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: always

  # --- STORAGE LAYER (S3 Compatible) ---
  minio:
    image: minio/minio:latest
    container_name: minio_server
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  # --- ORCHESTRATION LAYER (Airflow) ---
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    container_name: airflow_webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: airflow_scheduler
    restart: always

  # --- EXPLORATION LAYER ---
  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: jupyter_notebook
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./scripts:/home/jovyan/scripts
      - ./data:/home/jovyan/data
    environment:
      JUPYTER_TOKEN: "job-intelligent"

  # --- SERVING LAYER (FastAPI) ---
  fastapi:
    build: 
      context: ./fastapi
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: always

  # --- SETUP SERVICE ---
  # airflow-init:
  #   <<: *airflow-common
  #   command: version
  #   environment:
  #     <<: *airflow-common-env
  #     _AIRFLOW_DB_UPGRADE: 'true'
  #     _AIRFLOW_WWW_USER_CREATE: 'true'
  #   user: "0:0"
  
  # --- SETUP SERVICE (Creates folders and initializes DB) ---
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # 1. Create folders
        mkdir -p /opt/airflow/dags /opt/airflow/scripts/ingestion /opt/airflow/scripts/processing \
                 /opt/airflow/data/minio_data /opt/airflow/data/postgres_data \
                 /opt/airflow/data/bronze /opt/airflow/data/silver \
                 /opt/airflow/fastapi/app /opt/airflow/logs /opt/airflow/plugins /opt/airflow/notebooks
        
        chown -R 50000:0 /opt/airflow  # Fix permissions for the airflow user
        
        # 2. Run database migrations using the full path
        python -m airflow db migrate
        
        # 3. Create admin user
        python -m airflow users create \
            --username ${_AIRFLOW_WWW_USER_USERNAME:-airflow} \
            --password ${_AIRFLOW_WWW_USER_PASSWORD:-airflow} \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com
    user: "0:0"